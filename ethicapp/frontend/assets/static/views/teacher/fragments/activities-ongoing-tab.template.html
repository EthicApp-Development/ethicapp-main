<!-- "En curso" (#1050): the activities that are not finished, started or
     not, newest first, in the `activities-table` component (#1095): each
     row has its status, participants, code and launch, "Abrir panel" and a
     "⋯" menu. `getRows` gives a cached array, so the binding settles; the
     rows shown are cut by `limit`. -->
<section class="cases-table-section activities-ongoing-tab">
    <activities-table ng-if="ap.getRows('ongoing').length > 0"
        tab="ongoing"
        rows="ap.getRows('ongoing')"
        limit="ap.visibleCounts.ongoing"
        busy="ap.busy"
        on-action="ap.runAction(row, action)"
        on-copy-code="ap.copyCode(row)"></activities-table>

    <div class="cases-table-footer" ng-if="ap.getRows('ongoing').length > 0">
        <span>
            {{ ap.getOngoingFooter().showingKey | translate:{ shown: ap.getVisibleRows('ongoing').length, total: ap.getRows('ongoing').length } }}
            <span ng-if="ap.hasMoreRows('ongoing')">&middot;
                <button type="button" class="btn btn-link cases-show-more" ng-click="ap.showMore('ongoing')">
                    {{ 'activities_show_more' | translate }}
                </button>
            </span>
        </span>
        <span class="activities-tab-hint">{{ ap.getOngoingFooter().hintKey | translate }}</span>
    </div>

    <div class="alert alert-info" ng-if="ap.count('ongoing') === 0">
        <span>{{ 'activities_empty_ongoing' | translate }}</span>
    </div>
</section>
