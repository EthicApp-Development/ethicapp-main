<!-- The notice after a row action (#978): what happened, with its links
     ("Edit copy", "Undo"), or why the action failed. It disappears after a
     few seconds and can be dismissed. The live region stays in the page so
     screen readers announce each new notice. -->
<div class="designs-notice-region" role="status" aria-live="polite" aria-atomic="true">
    <div class="alert designs-notice" ng-if="dp.notice"
        ng-class="dp.notice.tone === 'danger' ? 'alert-danger' : 'alert-success'">
        <span class="designs-notice-message"
            ng-bind-html="dp.notice.messageKey | translate:dp.notice.params"></span>
        <span class="designs-notice-links" ng-if="dp.notice.actions.length > 0">
            <button type="button" class="btn btn-link designs-notice-link"
                ng-repeat="action in dp.notice.actions track by action.id"
                ng-click="dp.runNoticeAction(action)">{{ action.key | translate }}</button>
        </span>
        <button type="button" class="close designs-notice-dismiss"
            aria-label="{{ 'designs_notice_dismiss' | translate }}"
            ng-click="dp.dismissNotice()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
</div>
