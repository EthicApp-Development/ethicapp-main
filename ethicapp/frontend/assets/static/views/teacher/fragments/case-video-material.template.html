<section class="case-material" ng-if="$ctrl.videos.length > 0" aria-labelledby="{{ $ctrl.headingId }}">
    <h3 id="{{ $ctrl.headingId }}" class="case-material-heading">{{ 'case_material_heading' | translate }}</h3>
    <ol class="case-material-list">
        <li class="case-material-item" ng-repeat="video in $ctrl.videos track by video.youtubeVideoId">
            <video-facade
                ng-if="video.display === $ctrl.display.facade"
                class="case-material-video"
                video-id="video.youtubeVideoId"
                video-title="video.title || ('case_material_untitled_video' | translate)"
                metadata="video.metadata"></video-facade>

            <div class="rich-text-video-unavailable case-material-missing" ng-if="video.display === $ctrl.display.link">
                <span class="rich-text-video-notice">{{ 'case_material_metadata_missing' | translate }}</span>
                <a ng-href="{{ video.watchUrl }}" target="_blank" rel="noopener noreferrer">{{ video.watchUrl }} <span class="sr-only">{{ 'rich_text_link_new_tab' | translate }}</span></a>
                <span class="rich-text-video-source">{{ 'case_videos_source_youtube' | translate }}</span>
            </div>

            <p
                id="{{ $ctrl.descriptionId(video) }}"
                class="case-material-description"
                ng-class="{ 'is-collapsed': $ctrl.isCollapsed(video) }"
                ng-if="video.description">{{ video.description }}</p>
            <button
                type="button"
                class="btn btn-link btn-sm case-material-description-toggle"
                ng-if="video.description && video.hasLongDescription"
                ng-click="$ctrl.toggleDescription(video)"
                aria-controls="{{ $ctrl.descriptionId(video) }}"
                aria-expanded="{{ !$ctrl.isCollapsed(video) }}">
                {{ ($ctrl.isCollapsed(video) ? 'case_material_show_more' : 'case_material_show_less') | translate }}
            </button>
        </li>
    </ol>
</section>
