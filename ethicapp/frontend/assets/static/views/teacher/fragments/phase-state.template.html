<div class="phase-state">
    <div ng-if="ctrl.phaseData.descriptor.mode !== 'team'">
        <individual-phase-table
            phase-data="ctrl.phaseData"
            design-type="ctrl.designType"
            participant-query="ctrl.participantQuery"
            question-texts="ctrl.questionTexts"
            on-select-response="ctrl.onSelectResponse({ response: response, phaseData: phaseData })">
        </individual-phase-table>
    </div>
    <div ng-if="ctrl.phaseData.descriptor.mode === 'team'">
        <group-phase-table
            phase-data="ctrl.phaseData"
            design-type="ctrl.designType"
            participant-query="ctrl.participantQuery"
            question-texts="ctrl.questionTexts"
            on-select-response="ctrl.onSelectResponse({ response: response, phaseData: phaseData })"
            on-select-group="ctrl.onSelectGroup({ group: group, phaseData: phaseData })">
        </group-phase-table>
    </div>
</div>
